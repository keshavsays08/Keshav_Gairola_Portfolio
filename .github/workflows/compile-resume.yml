name: Compile Resume

on:
  push:
    paths:
      - 'resume/**.tex'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Keshav_Gairola_Resume.tex
          working_directory: resume
          latexmk_use_xelatex: true
          pre_compile: "tlmgr update --self && tlmgr install enumitem fontawesome5"
          
      - name: Copy PDF to public folder
        run: cp resume/Keshav_Gairola_Resume.pdf public/Keshav_Gairola_Resume.pdf

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add public/Keshav_Gairola_Resume.pdf
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "auto: recompile resume PDF"
          git push origin main
