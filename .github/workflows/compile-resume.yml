name: Compile Resume

on:
  push:
    paths:
      - 'resume/**.tex'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume/Keshav_Gairola_Resume.tex

      - name: Move PDF to public folder
        run: mv Keshav_Gairola_Resume.pdf public/Keshav_Gairola_Resume.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/Keshav_Gairola_Resume.pdf
          git commit -m "auto: update resume PDF" || echo "No changes"
          git push